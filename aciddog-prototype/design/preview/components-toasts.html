<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body>
<template id="card-content">
<div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
  <div style="background:var(--success-bg);border:1px solid color-mix(in oklab,var(--success) 30%,transparent);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;color:var(--success-fg);font-size:13px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    Deploy succeeded
  </div>
  <div style="background:var(--warning-bg);border:1px solid color-mix(in oklab,var(--warning) 30%,transparent);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;color:var(--warning-fg);font-size:13px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Build slow · 4m 12s
  </div>
  <div style="background:var(--danger-bg);border:1px solid color-mix(in oklab,var(--danger) 30%,transparent);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;color:var(--danger-fg);font-size:13px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Build failed · timeout
  </div>
</div></template>
<script src="_split.js"></script>
</body>
</html>
