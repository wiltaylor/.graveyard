<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  /* ─────────────────────────────────────────────────────────────────────
     TABS
     A horizontal tab bar with an underline indicator + content panels.
     Each tab can carry an icon, a count badge, and a disabled state.
     Keyboard: ←/→/Home/End move focus between tabs; Enter/Space activate.
     ───────────────────────────────────────────────────────────────────── */
  .tabs {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .tablist {
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 0 6px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border-subtle);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .tablist::-webkit-scrollbar { height: 4px; }
  .tablist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  .tab {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px;
    padding: 0 12px;
    background: transparent;
    border: 0; outline: 0;
    color: var(--fg-1);
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 0;
    transition: color var(--dur-1) var(--ease-out),
                background var(--dur-1) var(--ease-out);
  }
  .tab::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px; bottom: 0;
    height: 2px;
    background: transparent;
    border-radius: 2px 2px 0 0;
    transition: background var(--dur-2) var(--ease-out);
  }
  .tab:hover:not([aria-selected="true"]):not(:disabled) {
    color: var(--fg-0);
    background: color-mix(in oklab, var(--fg-0) 4%, transparent);
  }
  .tab[aria-selected="true"] {
    color: var(--fg-0);
  }
  .tab[aria-selected="true"]::after { background: var(--accent); }
  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    border-radius: 3px;
  }
  .tab:disabled {
    color: var(--fg-3);
    cursor: not-allowed;
  }

  .tab .ico {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    color: currentColor; opacity: 0.85;
  }
  .tab .ico svg { width: 14px; height: 14px; }
  .tab .count {
    display: inline-flex; align-items: center; justify-content: center;
    height: 16px; min-width: 16px; padding: 0 5px;
    border-radius: 999px;
    background: var(--bg-3);
    border: 1px solid var(--border-subtle);
    color: var(--fg-1);
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    line-height: 1;
  }
  .tab[aria-selected="true"] .count {
    background: var(--accent-bg);
    border-color: color-mix(in oklab, var(--accent) 30%, transparent);
    color: var(--accent-fg);
  }
  .tab .dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent);
  }

  .tablist .actions {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding-right: 4px;
  }
  .icon-btn {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    background: var(--bg-1);
    border-radius: var(--r-sm);
    color: var(--fg-1);
    cursor: pointer;
    align-self: center;
    transition: background var(--dur-1) var(--ease-out),
                border-color var(--dur-1) var(--ease-out),
                color var(--dur-1) var(--ease-out);
  }
  .icon-btn:hover { background: var(--bg-3); border-color: var(--border-strong); color: var(--fg-0); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ── Panels ───────────────────────────────────────────────────────── */
  .tabpanels { padding: 14px; }
  .tabpanel { display: none; }
  .tabpanel[data-active="true"] { display: block; }

  /* ── Demo content inside panels ───────────────────────────────────── */
  .panel-list {
    display: flex; flex-direction: column;
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-sm);
    overflow: hidden;
  }
  .panel-row {
    display: grid;
    grid-template-columns: 18px 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg-1);
  }
  .panel-row + .panel-row { border-top: 1px solid var(--border-subtle); }
  .panel-row:hover { background: var(--bg-2); }
  .panel-row .status {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--fg-3);
  }
  .panel-row .status.ok    { background: var(--success); box-shadow: 0 0 0 3px color-mix(in oklab, var(--success) 18%, transparent); }
  .panel-row .status.warn  { background: var(--warning); }
  .panel-row .status.fail  { background: var(--danger); }
  .panel-row .status.muted { background: var(--fg-3); }
  .panel-row .name { font-size: 13px; color: var(--fg-0); font-weight: 500; }
  .panel-row .name .sub {
    display: block; margin-top: 2px;
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
    font-weight: 400;
  }
  .panel-row .meta {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
    font-variant-numeric: tabular-nums;
  }
  .panel-row .chev { color: var(--fg-3); }
  .panel-row .chev svg { width: 14px; height: 14px; }

  .empty {
    padding: 28px 16px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--r-sm);
    color: var(--fg-2);
    font-size: 12.5px;
    background:
      repeating-linear-gradient(135deg, transparent 0 6px, var(--bg-2) 6px 7px);
  }

  /* ── Variant: pill / segmented (compact) ──────────────────────────── */
  .tabs.pill { background: transparent; border: 0; }
  .tabs.pill .tablist {
    display: inline-flex;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 3px;
    gap: 0;
  }
  .tabs.pill .tab {
    height: 28px;
    padding: 0 12px;
    border-radius: var(--r-pill);
    font-size: 12px;
  }
  .tabs.pill .tab::after { display: none; }
  .tabs.pill .tab[aria-selected="true"] {
    background: var(--bg-1);
    color: var(--fg-0);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .tabs.pill .tabpanels { display: none; }

  /* ── Variant: vertical (sidebar) ──────────────────────────────────── */
  .tabs.vertical {
    display: grid;
    grid-template-columns: 180px 1fr;
  }
  .tabs.vertical .tablist {
    flex-direction: column;
    align-items: stretch;
    background: var(--bg-2);
    border-right: 1px solid var(--border-subtle);
    border-bottom: 0;
    padding: 6px 6px 6px 0;
    gap: 1px;
    overflow-x: visible;
    overflow-y: auto;
  }
  .tabs.vertical .tab {
    justify-content: flex-start;
    height: 30px;
    padding: 0 12px;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: 12.5px;
  }
  .tabs.vertical .tab::after {
    left: 0; top: 4px; bottom: 4px;
    width: 2px; height: auto;
    border-radius: 0 2px 2px 0;
  }
  .tabs.vertical .tab[aria-selected="true"] {
    background: var(--bg-1);
  }
  .tabs.vertical .tab .count { margin-left: auto; }
  .tabs.vertical .tabpanels { padding: 14px; }

  .stack { display: flex; flex-direction: column; gap: 18px; }
  .label-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .label-row .lbl {
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--fg-2);
  }
</style>
</head>

<script>
(function () {
  function bindTabs(root) {
    const list   = root.querySelector('[role="tablist"]');
    if (!list) return;
    const tabs   = [...list.querySelectorAll('[role="tab"]')];
    const panels = [...root.querySelectorAll('.tabpanel')];

    function activate(tab, focus) {
      if (!tab || tab.disabled) return;
      tabs.forEach(t => {
        const sel = t === tab;
        t.setAttribute('aria-selected', sel ? 'true' : 'false');
        t.setAttribute('tabindex', sel ? '0' : '-1');
      });
      const id = tab.dataset.tab;
      panels.forEach(p => {
        p.setAttribute('data-active', p.dataset.panel === id ? 'true' : 'false');
      });
      if (focus) tab.focus();
    }

    // Initial state — ensure exactly one is selected
    const initial = tabs.find(t => t.getAttribute('aria-selected') === 'true' && !t.disabled)
                 || tabs.find(t => !t.disabled);
    activate(initial, false);

    tabs.forEach((t, i) => {
      t.addEventListener('click', () => activate(t, false));
      t.addEventListener('keydown', e => {
        const enabled = tabs.filter(x => !x.disabled);
        const cur = enabled.indexOf(t);
        let next = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = enabled[(cur + 1) % enabled.length];
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = enabled[(cur - 1 + enabled.length) % enabled.length];
        else if (e.key === 'Home') next = enabled[0];
        else if (e.key === 'End')  next = enabled[enabled.length - 1];
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(t, false); return; }
        if (next) { e.preventDefault(); activate(next, true); }
      });
    });
  }

  function init() {
    document.querySelectorAll('[data-tabs]').forEach(bindTabs);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else setTimeout(init, 0);
})();
</script>
</body>
