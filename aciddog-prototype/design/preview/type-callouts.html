<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .callout {
    display: grid;
    grid-template-columns: 18px 1fr;
    gap: 10px;
    align-items: start;
    padding: 12px 14px;
    border: 1px solid;
    border-radius: var(--r-md);
    margin-bottom: 8px;
  }
  .callout svg { width: 16px; height: 16px; margin-top: 2px; flex: none; }
  .callout .body { font-size: 13px; line-height: 1.5; }
  .callout .title {
    font-weight: 600; font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.08em;
  }
  .callout p { margin: 0; }
  .callout code { background: rgb(255 255 255 / .05); border: 0; }

  .callout-info    { background: var(--info-bg);    color: var(--info-fg);    border-color: color-mix(in oklab, var(--info)    25%, transparent); }
  .callout-success { background: var(--success-bg); color: var(--success-fg); border-color: color-mix(in oklab, var(--success) 25%, transparent); }
  .callout-warning { background: var(--warning-bg); color: var(--warning-fg); border-color: color-mix(in oklab, var(--warning) 25%, transparent); }
  .callout-danger  { background: var(--danger-bg);  color: var(--danger-fg);  border-color: color-mix(in oklab, var(--danger)  25%, transparent); }
  .callout-tip     { background: var(--accent-bg);  color: var(--accent-fg);  border-color: color-mix(in oklab, var(--accent)  25%, transparent); }

  .callout p, .callout .body { color: inherit; opacity: 0.92; }
</style></head>
<body>
<template id="card-content">

<div class="callout callout-info">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  <div class="body"><div class="title">Note</div><p>Deploys roll out to <code>main</code> on every push after CI passes.</p></div>
</div>

<div class="callout callout-tip">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
  <div class="body"><div class="title">Tip</div><p>Press <kbd>⌘K</kbd> to open the command palette from anywhere.</p></div>
</div>

<div class="callout callout-success">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <div class="body"><div class="title">Success</div><p>Pipeline locked — only signed commits can deploy to production.</p></div>
</div>

<div class="callout callout-warning">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <div class="body"><div class="title">Warning</div><p>Increasing the timeout above 10 min may incur additional billing.</p></div>
</div>

<div class="callout callout-danger">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
  <div class="body"><div class="title">Danger</div><p>This deletes all data in <code>db-replica-2</code>. Action cannot be undone.</p></div>
</div></template>
<script src="_split.js"></script>
</body>
</html>
