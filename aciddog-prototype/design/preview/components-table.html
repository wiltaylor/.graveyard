<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body>
<template id="card-content">
<style>
  table{font-size:13px}
  th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
  td{padding:8px 10px;border-bottom:1px solid var(--border-subtle);font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--bg-2)}
  .dot{width:6px;height:6px;border-radius:999px;display:inline-block;margin-right:8px;vertical-align:middle}
  .mono{font-family:var(--font-mono);font-size:12px;color:var(--fg-1)}
</style>
<div style="background:var(--bg-1);border:1px solid var(--border);border-radius:6px;overflow:hidden">
<table><thead><tr><th>service</th><th>status</th><th>p95</th><th>last deploy</th></tr></thead><tbody>
<tr><td><span class="dot" style="background:var(--success)"></span>api-gateway</td><td>Healthy</td><td>142 ms</td><td class="mono">2m ago</td></tr>
<tr><td><span class="dot" style="background:var(--success)"></span>auth</td><td>Healthy</td><td>38 ms</td><td class="mono">14m ago</td></tr>
<tr><td><span class="dot" style="background:var(--warning)"></span>workers</td><td>Degraded</td><td>1.2 s</td><td class="mono">1h ago</td></tr>
<tr><td><span class="dot" style="background:var(--danger)"></span>db-replica-2</td><td>Down</td><td>—</td><td class="mono">yesterday</td></tr>
</tbody></table>
</div></template>
<script src="_split.js"></script>
</body>
</html>
