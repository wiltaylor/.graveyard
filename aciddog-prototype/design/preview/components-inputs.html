<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body>
<template id="card-content">
<style>
  .field{display:flex;flex-direction:column;gap:4px}
  label{font-size:12px;color:var(--fg-1);font-weight:500}
  input,select{height:32px;padding:0 10px;background:var(--bg-1);border:1px solid var(--border);border-radius:4px;color:var(--fg-0);font:inherit;font-size:13px;outline:none;transition:border-color var(--dur-1) var(--ease-out)}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  input::placeholder{color:var(--fg-3)}
  .field.error input{border-color:var(--danger)}
  .help{font-size:11px;color:var(--fg-2)}
  .help.error{color:var(--danger-fg)}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
  <div class="field"><label>Project name</label><input value="forge-api"></div>
  <div class="field"><label>Region</label><select><option>us-east-1</option></select></div>
  <div class="field error"><label>Domain</label><input value="bad..host"><span class="help error">Invalid hostname</span></div>
</div></template>
<script src="_split.js"></script>
</body>
</html>
