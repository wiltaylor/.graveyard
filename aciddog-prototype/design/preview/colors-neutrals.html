<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body>
<template id="card-content">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
  <div class="swatch" style="background:var(--bg-0)"><span class="label">bg-0</span></div>
  <div class="swatch" style="background:var(--bg-1)"><span class="label">bg-1</span></div>
  <div class="swatch" style="background:var(--bg-2)"><span class="label">bg-2</span></div>
  <div class="swatch" style="background:var(--bg-3)"><span class="label">bg-3</span></div>
  <div class="swatch" style="background:var(--bg-4)"><span class="label">bg-4</span></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px">
  <div class="swatch" style="background:var(--fg-3);color:var(--bg-0)"><span class="label">fg-3</span></div>
  <div class="swatch" style="background:var(--fg-2);color:var(--bg-0)"><span class="label">fg-2</span></div>
  <div class="swatch" style="background:var(--fg-1);color:var(--bg-0)"><span class="label">fg-1</span></div>
  <div class="swatch" style="background:var(--fg-0);color:var(--bg-0)"><span class="label">fg-0</span></div>
</div></template>
<script src="_split.js"></script>
</body>
</html>
