<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .cb-list { display: flex; flex-direction: column; gap: 6px; }
  .cb-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0;
    cursor: pointer;
    font-size: 13px; color: var(--fg-0);
  }
  .cb-row .desc { font-size: 11px; color: var(--fg-2); line-height: 1.4; margin-top: 1px; display: block; }
  .cb-box {
    flex-shrink: 0;
    width: 16px; height: 16px;
    border-radius: 3px;
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    position: relative;
    margin-top: 2px;
    transition: background 80ms ease-out, border-color 80ms ease-out;
  }
  .cb-row:hover .cb-box { border-color: var(--accent); }
  .cb-row.checked .cb-box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .cb-row.checked .cb-box::after {
    content: ""; position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border-right: 2px solid var(--accent-contrast);
    border-bottom: 2px solid var(--accent-contrast);
    transform: rotate(45deg);
  }
  .cb-row.indet .cb-box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .cb-row.indet .cb-box::after {
    content: ""; position: absolute;
    left: 3px; right: 3px; top: 6.5px;
    height: 2px; background: var(--accent-contrast);
    border-radius: 1px;
  }
  .cb-row.disabled { color: var(--fg-3); cursor: not-allowed; }
  .cb-row.disabled .cb-box { background: var(--bg-2); border-color: var(--border); }

  .grouplabel {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg-2); font-weight: 600; font-family: var(--font-mono);
    margin-bottom: 6px;
  }
  .nest { padding-left: 26px; border-left: 1px solid var(--border-subtle); margin-left: 7px; }

  /* chip-style checkboxes */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 8px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px; color: var(--fg-1);
    cursor: pointer;
    transition: border-color 80ms ease-out, background 80ms ease-out, color 80ms ease-out;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg-0); }
  .chip.on {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--fg-3);
  }
  .chip.on .dot { background: var(--accent); }
</style>
</head>
<body>
<template id="card-content">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div>
    <div class="grouplabel">Notify on</div>
    <div class="cb-list">
      <label class="cb-row indet">
        <span class="cb-box"></span>
        <span>
          Pipeline events
          <span class="desc">3 of 5 selected</span>
        </span>
      </label>
      <div class="nest">
        <div class="cb-list">
          <label class="cb-row checked"><span class="cb-box"></span><span>Build failure</span></label>
          <label class="cb-row checked"><span class="cb-box"></span><span>Deploy success</span></label>
          <label class="cb-row checked"><span class="cb-box"></span><span>Rollback triggered</span></label>
          <label class="cb-row"><span class="cb-box"></span><span>Build started</span></label>
          <label class="cb-row disabled"><span class="cb-box"></span><span>Audit log entry <span class="desc">requires Pro plan</span></span></label>
        </div>
      </div>
    </div>
  </div>
  <div>
    <div class="grouplabel">Channels</div>
    <div class="chips">
      <span class="chip on"><span class="dot"></span>Slack · #ops</span>
      <span class="chip on"><span class="dot"></span>Email</span>
      <span class="chip"><span class="dot"></span>PagerDuty</span>
      <span class="chip"><span class="dot"></span>Webhook</span>
      <span class="chip"><span class="dot"></span>SMS</span>
    </div>
    <div class="grouplabel" style="margin-top:18px">Severity</div>
    <div class="chips">
      <span class="chip"><span class="dot"></span>info</span>
      <span class="chip on"><span class="dot"></span>warn</span>
      <span class="chip on"><span class="dot"></span>error</span>
      <span class="chip on"><span class="dot"></span>fatal</span>
    </div>
  </div>
</div>
</template>
<script src="_split.js"></script>
</body>
</html>
