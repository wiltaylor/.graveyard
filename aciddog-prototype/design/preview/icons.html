<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .ico-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px 8px; align-items: start; color: var(--fg-0); }
  .ico-cell { display: flex; flex-direction: column; align-items: center; gap: 6px;
              font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .ico-cell svg { width: 20px; height: 20px; color: var(--fg-0); display: block; }
  .ico-sizes { display: flex; gap: 16px; align-items: flex-end; margin-top: 14px; padding-top: 10px;
               border-top: 1px solid var(--border-subtle); color: var(--fg-0); }
  .ico-sizes .row-cell { display: flex; flex-direction: column; align-items: center; gap: 4px;
                         font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
</style></head>
