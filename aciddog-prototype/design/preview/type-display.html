<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css">
<style>
  .h-row {
    display: grid; grid-template-columns: 1fr auto;
    align-items: baseline; gap: 16px;
    padding: 6px 0; border-bottom: 1px solid var(--border-subtle);
  }
  .h-row:last-of-type { border-bottom: 0; }
  .h-spec {
    font-family: var(--font-mono); font-size: 10px; color: var(--fg-2);
    white-space: nowrap;
  }
  .h-sample { color: var(--fg-0); font-family: var(--font-sans); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .h1 { font-size: 34px; }
  .h2 { font-size: 28px; }
  .h3 { font-size: 22px; }
  .h4 { font-size: 18px; }
  .h5 { font-size: 16px; }
  .h6 { font-size: 14px; font-weight: 500; color: var(--fg-1); letter-spacing: 0; text-transform: uppercase; letter-spacing: 0.04em; }
</style></head>
<body>
<template id="card-content">
<div class="h-row"><span class="h-sample h1">Deploy succeeded</span><span class="h-spec">h1 · 34 / 1.2 · 600 · -0.01em</span></div>
<div class="h-row"><span class="h-sample h2">Build pipeline</span><span class="h-spec">h2 · 28 / 1.2 · 600 · -0.01em</span></div>
<div class="h-row"><span class="h-sample h3">Settings · Members</span><span class="h-spec">h3 · 22 / 1.2 · 600 · -0.01em</span></div>
<div class="h-row"><span class="h-sample h4">Recent deploys</span><span class="h-spec">h4 · 18 / 1.3 · 600</span></div>
<div class="h-row"><span class="h-sample h5">api-gateway</span><span class="h-spec">h5 · 16 / 1.3 · 600 · card titles</span></div>
<div class="h-row"><span class="h-sample h6">Section label</span><span class="h-spec">h6 · 14 / 1.3 · 500 · upper · 0.04em</span></div></template>
<script src="_split.js"></script>
</body>
</html>
