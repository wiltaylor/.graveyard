name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          if [[ "$IS_PRERELEASE" != "true" ]]; then
            echo "version=0.0.0-alpha" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Version

          | | |
          |---|---|
          | **Version** | `0.0.0-alpha` |
          | **Release** | No (no `Pre-release: true` trailer on HEAD) |
          SUMMARY
            exit 0
          fi

          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=1; PREV_PATCH=0
            RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"
            VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)

          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then
                MINOR=$((PREV_MINOR + 1)); PATCH=0; MAJOR=0
              else
                MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0
              fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha"

          echo "Calculated version: $VERSION (bump=$BUMP)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Version

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Release** | Pre-release |
          | **Bump** | $BUMP |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/aciddog-manager/web/package-lock.json
      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01
        with:
          key: aciddog-check
      - name: Build web frontend (required for embed)
        run: |
          cd crates/aciddog-manager/web
          npm ci
          npm run build
      - run: just app-fmt-check app-lint manager-fmt-check manager-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/aciddog-manager/web/package-lock.json
      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01
        with:
          key: aciddog-test
      - name: Build web frontend (required for embed)
        run: |
          cd crates/aciddog-manager/web
          npm ci
          npm run build
      - run: just wcl-schema-install
      - run: just app-test manager-test

  build:
    name: Build linux-x64
    runs-on: ubuntu-latest
    needs: [version, check, test]
    if: needs.version.outputs.do_release == 'true' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/aciddog-manager/web/package-lock.json
      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01
        with:
          key: aciddog-build
          workspaces: |
            . -> target
            crates/aciddog-manager -> target

      - name: Stamp version
        run: just version-set "${{ needs.version.outputs.version }}"

      - name: Build web frontend
        run: |
          cd crates/aciddog-manager/web
          npm ci
          npm run build

      - name: Build aciddog binary
        run: cargo build --release --locked --manifest-path crates/aciddog/Cargo.toml -p aciddog

      - name: Build aciddog-manager binary
        run: cargo build --release --locked --manifest-path crates/aciddog-manager/Cargo.toml

      - name: Stage release tarball
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          STAGE="aciddog-${VERSION}-linux-x64"
          mkdir -p "dist/${STAGE}/bin" "dist/${STAGE}/share/wcl"
          cp target/release/aciddog "dist/${STAGE}/bin/aciddog"
          cp crates/aciddog-manager/target/release/aciddog-manager "dist/${STAGE}/bin/aciddog-manager"
          cp wcl/aciddog.wcl "dist/${STAGE}/share/wcl/aciddog.wcl"
          cp README.md "dist/${STAGE}/README.md"
          tar -czf "${STAGE}.tar.gz" -C dist "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > SHA256SUMS
          ls -la "${STAGE}.tar.gz" SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            aciddog-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            SHA256SUMS
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.do_release == 'true' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: true
          files: artifacts/*
