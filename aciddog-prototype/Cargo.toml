[package]
name = "aciddog"
version = "0.1.0"
edition = "2021"
description = "Agentic orchestrator TUI driven by an aciddog.wcl config"
license = "MIT"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
wcl_lang = "0.9.0-alpha"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
pulldown-cmark = { version = "0.12", default-features = false }
similar = "2"
base64 = "0.22"
shlex = "1"
tempfile = "3"
dotenvy = "0.15"
cozo = { version = "0.7", default-features = false, features = ["minimal", "rayon", "requests"] }
fastembed = "5"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
glob = "0.3"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
bytes = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
dirs = "5"
urlencoding = "2"
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = { version = "0.5", features = ["util"] }
rustls = "0.23"
rustls-pemfile = "2"

[dev-dependencies]
wiremock = "0.6"
