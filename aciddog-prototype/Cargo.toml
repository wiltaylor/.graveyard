[package]
name = "aciddog"
version = "0.1.0"
edition = "2021"
description = "Agentic orchestrator TUI driven by an aciddog.wcl config"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
wcl_lang = "0.9.0-alpha"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
